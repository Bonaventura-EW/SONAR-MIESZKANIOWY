# ── Polityka propagacji dla TEGO repo ─────────────────────────────────
# Ten plik ROŚNIE w czasie. To jest "pamięć granic" agenta.
# Na starcie jest prawie pusty → wszystko trafia do Ciebie jako issue.
# Zmiany w tym pliku wchodzą przez PR, który zatwierdzasz (tak jak kod).
# Zła reguła nie wślizgnie się po cichu.

repo: "Bonaventura-EW/SONAR-MIESZKANIOWY"          # owner/name TEGO repo
family: "sonary"        # nazwa rodziny (bracia mają tę samą)

# Rodzeństwo, którego zmiany ten repo ma przeglądać co przebieg:
siblings:
  - Bonaventura-EW/SONAR-POKOJOWY
  - Bonaventura-EW/Sprzedaz-mieszkan
  - Bonaventura-EW/SONAR---DZIA-KOWY
  - Bonaventura-EW/parkingi-i-garaze      # pozostałe repo z tej rodziny, po jednym w linii jako  - owner/name

# ── TWARDE GRANICE (siatka bezpieczeństwa — rusza się rzadko) ─────────
# Propagacja NIGDY nie dotyka tych ścieżek, niezależnie od werdyktu.
never_touch:
  - ".propagation/**"
  - ".github/workflows/**"
  - ".claude/**"
  #  - "src/payments/**"
  #  - "src/config/secrets*"

# ── MIĘKKA POLITYKA (to jest to, co się UCZY) ────────────────────────
# Poziom autonomii per kategoria zmiany — steruje etykietą `propagate:go`,
# która wyzwala etap implementacji (Opus):
#   ask    → issue BEZ `propagate:go`. Ty nakładasz etykietę, gdy chcesz zbudować.
#            (DOMYŚLNIE — poziom 0, Ty jesteś kontrolerem)
#   draft  → etap decyzji sam nakłada `propagate:go` → Opus pisze DRAFT PR.
#            (poziom 1 — po awansie zasłużonym w decisions.jsonl)
#   AUTO-MERGE NIE ISTNIEJE. Ostatni, nieodwracalny krok zawsze robi człowiek.
#
# MODELE: decyzje = Sonnet (claude-sonnet-5), programowanie = Opus (claude-opus-4-8).
default_autonomy: ask

# 2026-09-22 distill-policy: żadna kategoria nadal nie osiąga progu awansu
# (≥8 rozstrzygniętych) — feature ma 4 rozstrzygnięcia, bugfix ma 5
# (obie 100% accepted, 0 odrzuceń, 0 odrzuceń bezpieczeństwa). Bugfix
# najbliżej progu. Za mało danych — obie kategorie zostają na "ask".
# Poprzedni stan (2026-09-09): feature 2, bugfix 3. Zobacz PR dla scorecardu.
categories: {}
  # css-refactor:   draft
  # a11y-fix:       draft
  # dependency-bump: ask

# Reguły destylowane z Twoich decyzji — dopisuje je skill `distill-policy`
# przez PR, który zatwierdzasz. Ręcznie też możesz.
learned_rules:
  - "Feature: propozycje rozszerzające już istniejący, architektonicznie analogiczny moduł (nie budowa od zera) są przyjmowane bez zastrzeżeń — dowody: issue#39 (promoted-listings-metric, rozszerzenie trend_generator.py), issue#40 (okazje-tab, rozszerzenie area_parser.py/area_price_generator.py), issue#47 (refresh-from-listing-card, rozszerzenie istniejącego badge'a na mapie), issue#54 (price-change-series, rozszerzenie trend_generator.py o kolejny build_*). 4/4 accepted, 0 odrzuceń."
  - "Bugfix: propozycje poparte bezpośrednim pomiarem/weryfikacją problemu w kodzie lub danych TEGO repo (nie hipotetycznym transferem z brata) są przyjmowane — dowody: issue#38/pr#42 (coincident-marker-stacks, zmierzone 255 grup kolizji / 1517 ofert), issue#45 (measured-index-history, potwierdzone dwoma własnymi łatkami symptomów), issue#46 (odpornosc-skanu, zweryfikowane w scraper.py/main.py), issue#50 (address-precision-upgrade, zmierzone 106 zamrożonych ofert), issue#51 (partial-day-dashed, zbudowane na architekturze z dobrym track-recordem). 5/5 accepted, 0 odrzuceń."
  #  - "Nie propaguj niczego, co rusza moduł auth (dotąd 0/6 przyjętych)."
  #  - "Zmiany typu css-refactor przyjmowane w 11/12 → kandydat do awansu na 'draft'."
