# ── Polityka propagacji dla TEGO repo ─────────────────────────────────
# Ten plik ROŚNIE w czasie. To jest "pamięć granic" agenta.
# Na starcie jest prawie pusty → wszystko trafia do Ciebie jako issue.
# Zmiany w tym pliku wchodzą przez PR, który zatwierdzasz (tak jak kod).
# Zła reguła nie wślizgnie się po cichu.

repo: "Bonaventura-EW/SONAR-MIESZKANIOWY"          # owner/name TEGO repo
family: "sonary"        # nazwa rodziny (bracia mają tę samą)

# Rodzeństwo, którego zmiany ten repo ma przeglądać co przebieg:
siblings:
  - Bonaventura-EW/SONAR-POKOJOWY
  - Bonaventura-EW/Sprzedaz-mieszkan
  - Bonaventura-EW/SONAR---DZIA-KOWY
  - Bonaventura-EW/parkingi-i-garaze      # pozostałe repo z tej rodziny, po jednym w linii jako  - owner/name

# ── TWARDE GRANICE (siatka bezpieczeństwa — rusza się rzadko) ─────────
# Propagacja NIGDY nie dotyka tych ścieżek, niezależnie od werdyktu.
never_touch:
  - ".propagation/**"
  - ".github/workflows/**"
  - ".claude/**"
  #  - "src/payments/**"
  #  - "src/config/secrets*"

# ── MIĘKKA POLITYKA (to jest to, co się UCZY) ────────────────────────
# Poziom autonomii per kategoria zmiany — steruje etykietą `propagate:go`,
# która wyzwala etap implementacji (Opus):
#   ask    → issue BEZ `propagate:go`. Ty nakładasz etykietę, gdy chcesz zbudować.
#            (DOMYŚLNIE — poziom 0, Ty jesteś kontrolerem)
#   draft  → etap decyzji sam nakłada `propagate:go` → Opus pisze DRAFT PR.
#            (poziom 1 — po awansie zasłużonym w decisions.jsonl)
#   AUTO-MERGE NIE ISTNIEJE. Ostatni, nieodwracalny krok zawsze robi człowiek.
#
# MODELE: decyzje = Sonnet (claude-sonnet-5), programowanie = Opus (claude-opus-4-8).
default_autonomy: ask

# 2026-11-03 distill-policy: feature osiągnął próg awansu — 8 rozstrzygniętych
# wpisów, 8/8 (100%) accepted, 0 odrzuceń bezpieczeństwa. AWANS na 'draft'
# (ósmy wpis: issue#68, velocity-history-chart). Bugfix ma 6 rozstrzygnięć
# (100% accepted) — wciąż za mało danych (próg ≥8). Poprzedni stan
# (2026-09-29): feature 7/8, bugfix 4/8. Zobacz PR dla scorecardu.
categories:
  feature: draft
  # css-refactor:   draft
  # a11y-fix:       draft
  # dependency-bump: ask

# Reguły destylowane z Twoich decyzji — dopisuje je skill `distill-policy`
# przez PR, który zatwierdzasz. Ręcznie też możesz.
learned_rules:
  - "Feature: propozycje rozszerzające już istniejący, architektonicznie analogiczny moduł (nie budowa od zera) są przyjmowane bez zastrzeżeń — dowody: issue#39 (promoted-listings-metric), issue#40 (okazje-tab), issue#47 (refresh-from-listing-card), issue#51 (partial-day-dashed), issue#54 (price-change-series), issue#58 (apexcharts-month-bands, kosmetyka), issue#59 (origin-filter-checkboxes), issue#68 (velocity-history-chart, rozszerzenie _flow_metric). 8/8 accepted, 0 odrzuceń — **AWANS na 'draft' (2026-11-03)**."
  - "Bugfix: propozycje poparte bezpośrednim pomiarem/weryfikacją problemu w kodzie lub danych TEGO repo (nie hipotetycznym transferem z brata) są przyjmowane — dowody: issue#38 (coincident-marker-stacks, zmierzone 255 grup kolizji / 1517 ofert), issue#45 (measured-index-history, potwierdzone dwoma własnymi łatkami symptomów), issue#46 (odpornosc-skanu, zweryfikowane w scraper.py/main.py), issue#50 (address-precision-upgrade, zmierzone 106 zamrożonych ofert), issue#65 (refiner-empty-street-crash, luka strukturalna potwierdzona w main.py), issue#67 (blink-returns-not-reactivations, zmierzone 8/268 ofert). 6/6 accepted, 0 odrzuceń — wciąż za mało danych (próg ≥8)."
  #  - "Nie propaguj niczego, co rusza moduł auth (dotąd 0/6 przyjętych)."
  #  - "Zmiany typu css-refactor przyjmowane w 11/12 → kandydat do awansu na 'draft'."
