name: SONAR MIESZKANIOWY Scanner

on:
  schedule:
    # 3 scany dziennie: 9:17, 15:17, 21:17 CEST (w zimie CET: 8:17, 14:17, 20:17)
    # Minuta 17 = off-peak (pełne godziny to największa kolejka GitHub Actions)
    - cron: '17 7,13,19 * * *'  # 9:17, 15:17, 21:17 CEST (off-peak, mniej pomijania)
    
  # Możliwość manualnego uruchomienia
  workflow_dispatch:

# FIX 2026-06-12: nigdy dwa skany równolegle (cron + watchdog + manualny dispatch
# mogą się nałożyć — dwa joby commitujące data/offers.json to ryzyko utraty danych
# mimo pętli pull --rebase). Nowy run czeka aż poprzedni skończy.
concurrency:
  group: sonar-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Pozwala na push do repo
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run SONAR MIESZKANIOWY scanner
        continue-on-error: true
        id: scanner
        run: |
          cd src
          python main.py || echo "::warning::Scanner failed but continuing..."
      
      # Co niedzielę napraw oferty z brakującymi coords.
      # Działa po main.py — ma dostęp do zaktualizowanego geocoding_cache.
      # continue-on-error: true — nie blokuje reszty pipeline jeśli coś się posypie.
      #
      # FIX 2026-05-30: warunek 'if' sprawdzał cron '0 7,13,19' (stary harmonogram),
      # ale aktywny cron to '17 7,13,19' — przez co krok NIGDY się nie wykonywał.
      # Usunięto kruchy warunek na konkretny string crona; o dzień tygodnia i tak
      # pyta `date` poniżej, więc działa dla dowolnego harmonogramu scheduled.
      - name: Fix missing coords (weekly, Sunday)
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: |
          DAY=$(TZ='Europe/Warsaw' date +'%u')  # 7 = niedziela
          if [ "$DAY" = "7" ]; then
            echo "Niedziela — uruchamiam fix_missing_coords.py..."
            cd src
            python fix_missing_coords.py --active-only || echo "::warning::fix_missing_coords failed"
          else
            echo "Nie niedziela (dzień $DAY) — pomijam fix_missing_coords."
          fi
      
      - name: Generate map data
        if: success() || steps.scanner.outcome == 'failure'
        continue-on-error: true
        run: |
          cd src
          python map_generator.py || echo "::warning::Map generator failed but continuing..."
      
      - name: Generate mobile API
        if: always()
        continue-on-error: true
        run: |
          cd src
          python api_generator.py || echo "::warning::API generator failed but continuing..."
      
      - name: Generate TOP5 data
        if: always()
        continue-on-error: true
        run: |
          cd src
          python top5_generator.py || echo "::warning::TOP5 generator failed but continuing..."

      - name: Generate area/price data
        if: always()
        continue-on-error: true
        run: |
          cd src
          python area_price_generator.py || echo "::warning::Area/price generator failed but continuing..."

      - name: Generate trend data
        if: always()
        continue-on-error: true
        run: |
          cd src
          python trend_generator.py || echo "::warning::Trend generator failed but continuing..."

      - name: Commit and push changes
        if: always()
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add data/ docs/data.json docs/descriptions.json docs/monitoring_data.json docs/api/ docs/skipped_debug.html docs/top5_data.json docs/area_price_data.json docs/trend_data.json || true
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "🤖 Automatyczny scan: $(TZ='Europe/Warsaw' date +'%Y-%m-%d %H:%M')" || true
          
          # FIX 2026-08-09: rozwiązywanie konfliktów w plikach GENEROWANYCH.
          # Dotąd przy kolizji z równoległym skanem robiliśmy `rebase --abort`
          # i próbowaliśmy dokładnie tak samo — trzy identyczne próby dawały trzy
          # identyczne konflikty i ~9 minut pracy szło do kosza
          # („dane skanu zostały utracone", run 31332905163).
          #
          # Wybieramy wersję ŚWIEŻEGO SKANU, bo pliki w data/ i docs/ są jednym
          # spójnym zestawem: docs/data.json jest pochodną data/offers.json z tego
          # samego przebiegu. Wzięcie połowy z jednego skanu, a połowy z drugiego
          # dałoby stan wewnętrznie sprzeczny. Tracimy wpis tamtego skanu
          # w historii — ale nasz i tak przeskanował całe listingi od nowa.
          #
          # UWAGA NA ODWRÓCONE ETYKIETY: w trakcie rebase `--ours` to zdalny main,
          # a `--theirs` to NASZ przepisywany commit. Zweryfikowane doświadczalnie —
          # intuicyjne `--ours` wyrzuciłoby dokładnie ten skan, który ratujemy.
          resolve_generated_conflicts() {
            local conflicted
            conflicted=$(git diff --name-only --diff-filter=U)
            if [ -z "$conflicted" ]; then
              return 1
            fi
            # Konflikt poza plikami generowanymi = kod źródłowy. Tu nie zgadujemy.
            if echo "$conflicted" | grep -qvE '^(data/|docs/)'; then
              echo "::error::Konflikt poza data/ i docs/ — nie rozwiązuję automatycznie:"
              echo "$conflicted"
              return 1
            fi
            local f
            for f in $conflicted; do
              git checkout --theirs -- "$f" 2>/dev/null && git add -- "$f" && continue
              # Plik skasowany po jednej ze stron — usuń go z indeksu i jedź dalej.
              git rm -q -- "$f" 2>/dev/null || true
            done
            echo "🔀 Rozwiązano konflikt na rzecz świeżego skanu: $(echo "$conflicted" | tr '\n' ' ')"
            return 0
          }

          # FIX 2026-05: pull --rebase + retry przed push, bo długie skany kolidują
          # z manualnymi commitami do main (push fast-forward fail).
          for attempt in 1 2 3; do
            echo "📤 Push attempt #$attempt..."

            # Pobierz najnowszy main i przepisz nasz commit na jego szczycie
            if ! git pull --rebase origin main; then
              # Rebase mógł się zatrzymać na kilku commitach po kolei — powtarzamy,
              # aż skończy albo aż trafimy na konflikt, którego nie wolno tknąć.
              rebase_ok=true
              while [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; do
                if ! resolve_generated_conflicts; then
                  rebase_ok=false
                  break
                fi
                if ! GIT_EDITOR=true git rebase --continue; then
                  rebase_ok=false
                  break
                fi
              done

              if [ "$rebase_ok" != true ]; then
                echo "::warning::Rebase #$attempt nie powiódł się. Próbuję od nowa."
                git rebase --abort 2>/dev/null || true
                sleep 5
                continue
              fi
            fi

            if git push origin main; then
              echo "✅ Push successful (attempt #$attempt)"
              exit 0
            else
              echo "::warning::Push #$attempt odrzucony. Retry za 10s..."
              sleep 10
            fi
          done

          echo "::error::Push failed po 3 próbach - dane skanu zostały utracone (nie zostały zapisane do repo)"
          exit 1
