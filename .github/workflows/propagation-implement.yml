name: Propagation Implement

# ── ETAP IMPLEMENTACJI (Opus) ─────────────────────────────────────────
# Wyzwalany, gdy issue dostanie etykietę `propagate:go`:
#   - dla kategorii `draft` etykietę nakłada sam etap decyzji (autonomia),
#   - dla kategorii `ask` etykietę nakłada CZŁOWIEK, gdy chce zbudować zmianę.
# Pisze adaptację na gałęzi i otwiera DRAFT PR. Nigdy nie merguje.

on:
  issues:
    types: [labeled]

concurrency:
  group: propagation-implement-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    # odpal tylko dla właściwej etykiety
    if: github.event.label.name == 'propagate:go'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # gałąź + push
      pull-requests: write   # draft PR
      issues: write          # komentarz + zdjęcie/dodanie etykiety
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.SIBLINGS_TOKEN }}   # read manifestu brata
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/implement-propagation issue #${{ github.event.issue.number }}"
          claude_args: |
            --model claude-opus-4-8
            --max-turns 60
            --allowedTools "Read,Write,Edit,Bash"
