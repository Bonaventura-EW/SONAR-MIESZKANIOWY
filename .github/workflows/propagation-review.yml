name: Propagation Review

# ── ETAP DECYZJI (Sonnet) ─────────────────────────────────────────────
# Cron pon/czw/sob. Zbiera zmiany braci, ocenia, otwiera issue z werdyktem.
# Kod pisze dopiero drugi workflow (Opus), wyzwalany etykietą propagate:go.

on:
  schedule:
    # 07:00 UTC = 09:00 Europe/Warsaw latem (UTC+2); zimą 08:00. Szczegóły w README.
    - cron: "0 7 * * 1,4,6"
  workflow_dispatch: {}

# GitHub odpala scheduled workflow TYLKO z gałęzi domyślnej.
# W repo PUBLICZNYM harmonogram usypia po 60 dniach bez aktywności.

concurrency:
  group: propagation-review
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write        # commit rejestru/stanu
      issues: write          # otwieranie issue + etykiety
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.SIBLINGS_TOKEN }}   # read do repo-braci
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/evaluate-propagation"
          claude_args: |
            --model claude-sonnet-5
            --max-turns 40
            --allowedTools "Read,Write,Edit,Bash(gh:*),Bash(git:*),Bash(jq:*),Bash(date:*)"
